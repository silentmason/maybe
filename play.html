<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Playground • Silent Masonwolf</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a12;
      color: #e0e0ff;
      font-family: 'Courier New', monospace;
      overflow: hidden;
      height: 100vh;
      cursor: none; /* Hide default cursor for custom trail */
    }
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .overlay {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 2rem;
      pointer-events: none;
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 1.5rem;
      background: linear-gradient(45deg, #ff7eb3, #64ffda);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: 1px;
    }
    .reactive-text {
      font-size: 1.4rem;
      margin: 0.5rem 0;
      transition: transform 0.1s ease, color 0.2s ease;
    }
    .back {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #555;
      text-decoration: none;
      font-size: 0.9rem;
      pointer-events: auto;
    }
    .back:hover {
      color: #aaa;
    }
  </style>
</head>
<body>
  <a href="index.html" class="back">← Home</a>
  
  <div class="overlay">
    <h1>SILENT INTERACT</h1>
    <div class="reactive-text" id="text1">Move near me</div>
    <div class="reactive-text" id="text2">Click to summon particles</div>
    <div class="reactive-text" id="text3">Explore the void</div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    // === Canvas Setup ===
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let width = window.innerWidth;
    let height = window.innerHeight;

    canvas.width = width;
    canvas.height = height;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    // === Mouse Position ===
    const mouse = { x: width / 2, y: height / 2, down: false };
    document.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });
    document.addEventListener('mousedown', () => mouse.down = true);
    document.addEventListener('mouseup', () => mouse.down = false);

    // === Mouse Trail Particles ===
    const trail = [];
    const trailLength = 15;

    // === Generative Drifting Particles ===
    const particles = [];
    const particleCount = 80;

    class Particle {
      constructor() {
        this.reset();
        this.vx = (Math.random() - 0.5) * 0.5;
        this.vy = (Math.random() - 0.5) * 0.5;
        this.size = Math.random() * 3 + 1;
        this.hue = Math.random() * 360;
      }

      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;

        // Drift slowly and loop
        if (this.x < 0) this.x = width;
        if (this.x > width) this.x = 0;
        if (this.y < 0) this.y = height;
        if (this.y > height) this.y = 0;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${this.hue}, 80%, 60%, 0.7)`;
        ctx.fill();
      }
    }

    // Initialize particles
    for (let i = 0; i < particleCount; i++) {
      particles.push(new Particle());
    }

    // === Reactive Text Elements ===
    const texts = [
      { el: document.getElementById('text1'), x: width * 0.5, y: height * 0.4 },
      { el: document.getElementById('text2'), x: width * 0.5, y: height * 0.5 },
      { el: document.getElementById('text3'), x: width * 0.5, y: height * 0.6 }
    ];

    function updateTextPositions() {
      texts.forEach(t => {
        const rect = t.el.getBoundingClientRect();
        t.x = rect.left + rect.width / 2;
        t.y = rect.top + rect.height / 2;
      });
    }

    // === Main Animation Loop ===
    function animate() {
      // Fade background for trail persistence
      ctx.fillStyle = 'rgba(10, 10, 18, 0.1)';
      ctx.fillRect(0, 0, width, height);

      // Update & draw generative particles
      particles.forEach(p => {
        p.update();
        p.draw();
      });

      // Add new trail particle
      trail.push({ x: mouse.x, y: mouse.y, life: 1 });
      if (trail.length > trailLength) trail.shift();

      // Draw trail with glow
      trail.forEach((point, i) => {
        const alpha = (i / trailLength) * 0.8;
        const size = (i / trailLength) * 12;
        ctx.beginPath();
        ctx.arc(point.x, point.y, size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(100, 255, 218, ${alpha})`;
        ctx.fill();
      });

      // Update reactive text
      updateTextPositions();
      texts.forEach(t => {
        const dx = mouse.x - t.x;
        const dy = mouse.y - t.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const maxDist = 200;

        if (dist < maxDist) {
          const scale = 1 + (1 - dist / maxDist) * 0.3;
          const hue = 180 + (1 - dist / maxDist) * 120;
          t.el.style.transform = `scale(${scale})`;
          t.el.style.color = `hsl(${hue}, 100%, 80%)`;
        } else {
          t.el.style.transform = 'scale(1)';
          t.el.style.color = '#a0a0ff';
        }
      });

      // On click: burst of particles
      if (mouse.down) {
        for (let i = 0; i < 5; i++) {
          particles.push(new Particle());
          const p = particles[particles.length - 1];
          p.x = mouse.x;
          p.y = mouse.y;
          p.vx = (Math.random() - 0.5) * 4;
          p.vy = (Math.random() - 0.5) * 4;
          p.size = Math.random() * 4 + 2;
        }
        mouse.down = false; // Only burst once per click
      }

      // Keep drifting particles within limit
      if (particles.length > 200) {
        particles.splice(0, 20);
      }

      requestAnimationFrame(animate);
    }

    // Start!
    animate();
  </script>
</body>
</html>
